<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Offline - DOOTOR ENTERPRISES</title>
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            max-width: 440px;
            width: 100%;
            padding: 40px 28px;
        }
        .brand-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #004225 0%, #0a5c36 100%);
            box-shadow: 0 8px 20px rgba(0, 66, 37, 0.25);
        }
        .brand-logo img {
            width: 52px;
            height: 52px;
            object-fit: contain;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #004225;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .btn-retry {
            display: inline-block;
            background-color: #004225;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            padding: 13px 32px;
            border-radius: 50px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 66, 37, 0.3);
            transition: all 0.2s ease;
        }
        .btn-retry:hover {
            background-color: #002b18;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="brand-logo">
            <img src="/icons/icon-192x192.png" alt="DOOTOR Logo">
        </div>
        <h1>Connection Offline</h1>
        <p>You appear to be offline or experiencing connection drops. Your previous application drafts remain safely stored.</p>
        <button class="btn-retry" onclick="window.location.reload();">Retry Connection</button>
    </div>
</body>
</html>
