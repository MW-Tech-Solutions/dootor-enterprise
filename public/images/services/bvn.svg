<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold_b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow_b">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#bg_b)"/>
  <circle cx="120" cy="120" r="140" fill="#f59e0b" opacity="0.06"/>
  <!-- BVN Vault & Bank Card -->
  <g transform="translate(100, 60)" filter="url(#shadow_b)">
    <!-- Back Card -->
    <rect x="40" y="-15" width="340" height="210" rx="16" fill="#1e293b" stroke="#334155" opacity="0.6"/>
    <!-- Front Primary Card -->
    <rect x="0" y="15" width="380" height="235" rx="18" fill="linear-gradient(135deg, #1e293b 0%, #090d16 100%)" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Bank Emblem -->
    <g transform="translate(35, 45)">
      <circle cx="16" cy="16" r="16" fill="url(#gold_b)"/>
      <path d="M8 20 L16 10 L24 20 Z M10 22 H22" stroke="#000" stroke-width="1.5" fill="none"/>
    </g>
    <text x="75" y="58" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="1">CENTRAL BANK OF NIGERIA</text>
    <text x="75" y="72" font-family="'Outfit', sans-serif" font-size="9" font-weight="600" fill="#f59e0b">BANK VERIFICATION NUMBER (BVN)</text>
    <!-- Chip -->
    <rect x="35" y="100" width="46" height="36" rx="6" fill="#fcd34d" stroke="#b45309"/>
    <!-- Number Display -->
    <text x="35" y="170" font-family="monospace" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="3">2241 &bull;&bull;&bull;&bull; 9081</text>
    <text x="35" y="200" font-family="'Outfit', sans-serif" font-size="10" fill="#94a3b8">HOLDER: <tspan fill="#ffffff" font-weight="600">CONFIRMED ACCOUNT</tspan></text>
    <text x="35" y="220" font-family="'Outfit', sans-serif" font-size="10" fill="#94a3b8">INTER-BANK: <tspan fill="#10b981" font-weight="700">&#10003; LINKED &amp; COMPLIANT</tspan></text>
    <!-- Shield Right -->
    <g transform="translate(300, 140)">
      <circle cx="25" cy="25" r="28" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="2"/>
      <path d="M25 12 L37 17 V26 C37 34 25 40 25 40 C25 40 13 34 13 26 V17 Z" fill="#f59e0b"/>
      <path d="M21 26 L24 29 L30 22" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>