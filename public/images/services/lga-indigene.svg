<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_lga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow_lga">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#bg_lga)"/>
  <g transform="translate(130, 45)" filter="url(#shadow_lga)">
    <rect width="340" height="290" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Top Green Stripe -->
    <rect width="340" height="55" rx="14" fill="#004225"/>
    <rect y="40" width="340" height="15" fill="#004225"/>
    <text x="170" y="26" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#fef08a" text-anchor="middle">LOCAL GOVERNMENT AREA (LGA)</text>
    <text x="170" y="42" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">CERTIFICATE OF INDIGENIZATION &amp; STATE OF ORIGIN</text>
    <!-- Nigerian Flag Ribbon -->
    <g transform="translate(40, 75)">
      <rect x="0" y="0" width="14" height="20" fill="#008751"/>
      <rect x="14" y="0" width="14" height="20" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="28" y="0" width="14" height="20" fill="#008751"/>
    </g>
    <text x="95" y="88" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0f172a">OFFICIAL INDIGENE RECORD</text>
    <!-- Document content -->
    <rect x="40" y="115" width="260" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="40" y="130" width="230" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="40" y="145" width="250" height="4" rx="2" fill="#e2e8f0"/>
    <!-- Local Seal -->
    <g transform="translate(230, 180)">
      <circle cx="28" cy="28" r="30" fill="#004225" stroke="#d4af37" stroke-width="2"/>
      <circle cx="28" cy="28" r="24" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="28" y="27" font-family="'Outfit', sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">LGA COUNCIL</text>
      <text x="28" y="36" font-family="'Outfit', sans-serif" font-size="7" font-weight="700" fill="#d4af37" text-anchor="middle">ORIGIN CERTIFIED</text>
    </g>
    <!-- Council Signature -->
    <line x1="45" y1="230" x2="140" y2="230" stroke="#004225" stroke-width="1.5"/>
    <text x="45" y="245" font-family="'Outfit', sans-serif" font-size="9" fill="#475569">Supervisory Councillor / Secretary</text>
  </g>
</svg>