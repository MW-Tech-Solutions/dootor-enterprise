<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow_d">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#bg_d)"/>
  <!-- Driver License Card -->
  <g transform="translate(110, 65)" filter="url(#shadow_d)">
    <rect width="380" height="240" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Top banner -->
    <rect width="380" height="42" rx="16" fill="#004225"/>
    <rect y="30" width="380" height="12" fill="#004225"/>
    <text x="24" y="26" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">FEDERAL ROAD SAFETY CORPS (FRSC)</text>
    <text x="356" y="26" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#fef08a" text-anchor="end">NATIONAL DRIVER'S LICENCE</text>
    <!-- Photo Frame -->
    <rect x="25" y="65" width="85" height="105" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <circle cx="67" cy="102" r="20" fill="#94a3b8"/>
    <path d="M45 145 Q67 125 89 145" stroke="#94a3b8" stroke-width="12" fill="none"/>
    <!-- License details -->
    <text x="125" y="75" font-family="'Outfit', sans-serif" font-size="9" fill="#64748b">LICENCE NO.</text>
    <text x="125" y="92" font-family="monospace" font-size="15" font-weight="700" fill="#0f172a">FRSC-8921-NDL</text>
    <text x="125" y="115" font-family="'Outfit', sans-serif" font-size="9" fill="#64748b">CLASS: <tspan fill="#0f172a" font-weight="700">E (PRIVATE &amp; COMMERCIAL)</tspan></text>
    <text x="125" y="135" font-family="'Outfit', sans-serif" font-size="9" fill="#64748b">AUTHENTICATION: <tspan fill="#10b981" font-weight="700">&#10003; VERIFIED LETTER ISSUED</tspan></text>
    <!-- Steering Wheel Emblem -->
    <g transform="translate(305, 125)">
      <circle cx="25" cy="25" r="24" fill="rgba(0, 66, 37, 0.1)" stroke="#004225" stroke-width="2"/>
      <circle cx="25" cy="25" r="7" fill="#004225"/>
      <line x1="25" y1="1" x2="25" y2="18" stroke="#004225" stroke-width="2.5"/>
      <line x1="1" y1="25" x2="18" y2="25" stroke="#004225" stroke-width="2.5"/>
      <line x1="32" y1="25" x2="49" y2="25" stroke="#004225" stroke-width="2.5"/>
    </g>
    <!-- Footer Hologram Strip -->
    <rect x="25" y="195" width="330" height="26" rx="4" fill="linear-gradient(90deg, #dcfce7, #fef9c3, #e0f2fe)"/>
    <text x="190" y="212" font-family="'Outfit', sans-serif" font-size="9.5" font-weight="700" fill="#065f46" text-anchor="middle" letter-spacing="2">&bull; OFFICIAL EMBASSY AUTHENTICATION LETTER &bull;</text>
  </g>
</svg>