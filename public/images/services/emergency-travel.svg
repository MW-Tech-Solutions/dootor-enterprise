<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_etc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow_etc">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#bg_etc)"/>
  <circle cx="500" cy="80" r="120" fill="#ef4444" opacity="0.08"/>
  <g transform="translate(130, 45)" filter="url(#shadow_etc)">
    <rect width="340" height="280" rx="14" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <!-- Red Header -->
    <rect width="340" height="56" rx="14" fill="#991b1b"/>
    <rect y="40" width="340" height="16" fill="#991b1b"/>
    <text x="170" y="26" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#fef08a" text-anchor="middle">EMBASSY / HIGH COMMISSION</text>
    <text x="170" y="44" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">EMERGENCY TRAVEL CERTIFICATE (ETC)</text>
    <!-- Emergency Tag -->
    <rect x="25" y="75" width="110" height="24" rx="12" fill="#fee2e2" stroke="#ef4444"/>
    <circle cx="37" cy="87" r="5" fill="#ef4444"/>
    <text x="48" y="91" font-family="'Outfit', sans-serif" font-size="9" font-weight="800" fill="#991b1b">URGENT TRAVEL</text>
    <!-- Flight & Route Details -->
    <text x="25" y="130" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#0f172a">ONE-WAY EMERGENCY REPATRIATION</text>
    <text x="25" y="150" font-family="'Outfit', sans-serif" font-size="9.5" fill="#475569">Permits direct border crossing &amp; airline boarding</text>
    <text x="25" y="170" font-family="'Outfit', sans-serif" font-size="9.5" fill="#16a34a" font-weight="600">&#10003; High Commission Liaison &amp; Fast-Track Delivery</text>
    <!-- Boarding / Wing Badge -->
    <g transform="translate(235, 185)">
      <circle cx="28" cy="28" r="30" fill="#7f1d1d" stroke="#fca5a5" stroke-width="2"/>
      <path d="M12 30 L28 16 L44 30 L38 30 L28 22 L18 30 Z" fill="#ffffff"/>
      <text x="28" y="44" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="800" fill="#fef08a" text-anchor="middle">ETC VALID</text>
    </g>
  </g>
</svg>