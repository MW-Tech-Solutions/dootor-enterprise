<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow_p">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#bg_p)"/>
  <!-- Police Clearance Certificate -->
  <g transform="translate(130, 45)" filter="url(#shadow_p)">
    <rect width="340" height="280" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Top crest banner -->
    <rect width="340" height="60" rx="14" fill="#064e3b"/>
    <rect y="44" width="340" height="16" fill="#064e3b"/>
    <!-- Police Shield Badge -->
    <g transform="translate(45, 30)">
      <path d="M0 -15 L14 -9 V6 C14 15 0 22 0 22 C0 22 -14 15 -14 6 V-9 Z" fill="#eab308" stroke="#ca8a04"/>
      <path d="M-6 3 L-1 8 L7 -2" stroke="#064e3b" stroke-width="2.5" fill="none"/>
    </g>
    <text x="75" y="28" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff">THE NIGERIA POLICE FORCE</text>
    <text x="75" y="44" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="#fef08a">CHARACTER CLEARANCE CERTIFICATE</text>
    <!-- Document Text Lines -->
    <text x="35" y="95" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0f172a">CRIMINAL RECORDS REGISTRY (CID)</text>
    <rect x="35" y="110" width="270" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="35" y="122" width="220" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="35" y="134" width="250" height="4" rx="2" fill="#e2e8f0"/>
    <!-- Fingerprint Clearance -->
    <rect x="35" y="160" width="80" height="90" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="2 2"/>
    <circle cx="75" cy="205" r="22" fill="#e2e8f0"/>
    <text x="75" y="240" font-family="'Outfit', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">BIOMETRIC CLEARED</text>
    <!-- Wax Seal -->
    <g transform="translate(245, 205)">
      <circle cx="20" cy="20" r="32" fill="#b91c1c" stroke="#991b1b" stroke-width="2"/>
      <circle cx="20" cy="20" r="26" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="20" y="18" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">OFFICIAL</text>
      <text x="20" y="29" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">CLEARED</text>
    </g>
  </g>
</svg>