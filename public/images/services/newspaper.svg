<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_news" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow_news">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#bg_news)"/>
  <g transform="translate(130, 45)" filter="url(#shadow_news)">
    <!-- Newspaper Fold -->
    <rect width="340" height="280" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Masthead -->
    <rect width="340" height="45" rx="10" fill="#0f172a"/>
    <rect y="35" width="340" height="10" fill="#0f172a"/>
    <text x="170" y="26" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">NATIONAL DAILY GAZETTE</text>
    <text x="170" y="40" font-family="'Outfit', sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">OFFICIAL PUBLIC NOTICES &amp; CHANGE OF NAME</text>
    <!-- Highlighted Public Notice Box -->
    <rect x="25" y="65" width="290" height="110" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <rect x="35" y="75" width="110" height="18" rx="4" fill="#eab308"/>
    <text x="90" y="88" font-family="'Outfit', sans-serif" font-size="9" font-weight="800" fill="#000" text-anchor="middle">PUBLIC NOTICE</text>
    <text x="35" y="112" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0f172a">CHANGE OF NAME / DECLARATION</text>
    <text x="35" y="130" font-family="'Outfit', sans-serif" font-size="9" fill="#475569">"I formerly known and addressed as... now wish to be known..."</text>
    <text x="35" y="148" font-family="'Outfit', sans-serif" font-size="9" fill="#16a34a" font-weight="600">&#10003; Published in National Circulation</text>
    <text x="35" y="162" font-family="'Outfit', sans-serif" font-size="8.5" fill="#64748b">Full Newspaper Copy &amp; Page Extract Included</text>
    <!-- Columns Below -->
    <rect x="25" y="190" width="85" height="70" rx="4" fill="#f1f5f9"/>
    <rect x="120" y="190" width="85" height="70" rx="4" fill="#f1f5f9"/>
    <rect x="215" y="190" width="100" height="70" rx="4" fill="#f1f5f9"/>
  </g>
</svg>