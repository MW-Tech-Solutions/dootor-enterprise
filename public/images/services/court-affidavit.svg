<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_c">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#bg_c)"/>
  <g transform="translate(140, 45)" filter="url(#shadow_c)">
    <!-- Parchment Certificate -->
    <rect width="320" height="290" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="12" y="12" width="296" height="266" rx="8" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="4 2"/>
    <!-- Scales of Justice Emblem -->
    <g transform="translate(160, 48)">
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#b45309" stroke-width="2.5"/>
      <line x1="-24" y1="-12" x2="24" y2="-12" stroke="#b45309" stroke-width="2.5"/>
      <path d="M-24 -12 L-32 0 H-16 Z" fill="none" stroke="#b45309" stroke-width="1.5"/>
      <path d="M24 -12 L16 0 H32 Z" fill="none" stroke="#b45309" stroke-width="1.5"/>
      <rect x="-8" y="16" width="16" height="4" fill="#b45309"/>
    </g>
    <text x="160" y="85" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle" letter-spacing="1">IN THE HIGH COURT OF JUSTICE</text>
    <text x="160" y="102" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">SWORN COURT AFFIDAVIT</text>
    <!-- Legal Lines -->
    <rect x="35" y="120" width="250" height="3" rx="1.5" fill="#d97706" opacity="0.3"/>
    <rect x="35" y="132" width="230" height="3" rx="1.5" fill="#d97706" opacity="0.3"/>
    <rect x="35" y="144" width="260" height="3" rx="1.5" fill="#d97706" opacity="0.3"/>
    <rect x="35" y="156" width="210" height="3" rx="1.5" fill="#d97706" opacity="0.3"/>
    <!-- Commissioner of Oaths Stamp & Seal -->
    <g transform="translate(225, 205)">
      <!-- Red Wax Seal with Ribbon -->
      <path d="M12 25 L5 48 L18 42 L31 48 L24 25 Z" fill="#991b1b"/>
      <circle cx="18" cy="18" r="22" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
      <circle cx="18" cy="18" r="17" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="18" y="21" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle">COMMISSIONER</text>
    </g>
    <!-- Signature Line -->
    <line x1="40" y1="230" x2="130" y2="230" stroke="#78350f" stroke-width="1.5"/>
    <path d="M45 225 Q60 210 75 228 T110 215" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <text x="40" y="245" font-family="'Outfit', sans-serif" font-size="9" fill="#78350f">Deponent Signature</text>
  </g>
</svg>