<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_birth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow_birth">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#bg_birth)"/>
  <g transform="translate(130, 45)" filter="url(#shadow_birth)">
    <rect width="340" height="290" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Top Green Header -->
    <rect width="340" height="60" rx="14" fill="#004225"/>
    <rect y="46" width="340" height="14" fill="#004225"/>
    <text x="170" y="28" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#fef08a" text-anchor="middle">NATIONAL POPULATION COMMISSION (NPC)</text>
    <text x="170" y="44" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">CERTIFICATE OF BIRTH / ATTESTATION</text>
    <!-- Border Frame -->
    <rect x="15" y="70" width="310" height="205" rx="6" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- Footprint Icons -->
    <g transform="translate(50, 115) scale(0.7)">
      <ellipse cx="20" cy="35" rx="12" ry="18" fill="#10b981" opacity="0.3"/>
      <circle cx="12" cy="10" r="4" fill="#10b981" opacity="0.3"/>
      <circle cx="18" cy="8" r="3.5" fill="#10b981" opacity="0.3"/>
      <circle cx="24" cy="9" r="3" fill="#10b981" opacity="0.3"/>
    </g>
    <!-- Data Fields -->
    <text x="100" y="105" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#0f172a">ENTRY IN REGISTER OF BIRTHS</text>
    <rect x="100" y="115" width="200" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="100" y="130" width="180" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="100" y="145" width="190" height="4" rx="2" fill="#e2e8f0"/>
    <!-- Golden Official NPC Seal -->
    <g transform="translate(240, 180)">
      <circle cx="25" cy="25" r="28" fill="#d97706" stroke="#b45309" stroke-width="2"/>
      <circle cx="25" cy="25" r="23" fill="#f59e0b"/>
      <circle cx="25" cy="25" r="18" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="25" y="24" font-family="'Outfit', sans-serif" font-size="7" font-weight="800" fill="#ffffff" text-anchor="middle">NPC SEAL</text>
      <text x="25" y="32" font-family="'Outfit', sans-serif" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle">VERIFIED</text>
    </g>
    <!-- Barcode -->
    <g transform="translate(40, 220)">
      <rect x="0" y="0" width="2" height="30" fill="#0f172a"/>
      <rect x="5" y="0" width="4" height="30" fill="#0f172a"/>
      <rect x="12" y="0" width="2" height="30" fill="#0f172a"/>
      <rect x="17" y="0" width="6" height="30" fill="#0f172a"/>
      <rect x="26" y="0" width="3" height="30" fill="#0f172a"/>
      <rect x="32" y="0" width="5" height="30" fill="#0f172a"/>
      <rect x="40" y="0" width="2" height="30" fill="#0f172a"/>
      <rect x="45" y="0" width="6" height="30" fill="#0f172a"/>
      <text x="0" y="42" font-family="monospace" font-size="8" fill="#64748b">NPC-BTH-2026-9921</text>
    </g>
  </g>
</svg>