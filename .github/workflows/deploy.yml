name: 🚀 Deploy Website via Webhook

on:
  push:
    branches:
      - main  # Trigger deployment when code is pushed to the main branch

jobs:
  web-deploy:
    name: ⛑️ Trigger Server Pull
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📡 Trigger Deploy Webhook on Server
      run: |
        echo "Triggering deployment webhook on server..."
        HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
          -X POST \
          -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
          "${{ secrets.DEPLOY_WEBHOOK_URL }}")

        echo "--- Server Response ---"
        cat /tmp/deploy_response.txt
        echo ""
        echo "--- HTTP Status: $HTTP_STATUS ---"

        if [ "$HTTP_STATUS" != "200" ]; then
          echo "❌ Deployment failed with HTTP status $HTTP_STATUS"
          exit 1
        fi

        echo "✅ Deployment triggered successfully!"
