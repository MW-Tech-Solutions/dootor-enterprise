name: 🚀 Deploy Website to Bluehost via FTP

on:
  push:
    branches:
      - main  # Trigger deployment when code is pushed to the main branch

jobs:
  web-deploy:
    name: ⛑️ Deploy Codebase
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files to Bluehost FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        # Change this path to match your subdomain folder on Bluehost (e.g. /public_html/dootor-enterprise/)
        server-dir: ./  
        exclude: |
          **/.git*
          **/.git*/**
          **/.github*/**
          **/node_modules/**
          **/.env
          **/.env.*
          **/.env.example
          database.sql
          tests/**
          storage/framework/cache/**
          storage/framework/sessions/**
          storage/framework/views/**
          storage/logs/**
          storage/app/public/**
